name: Snyk
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    name: Snyk dependencies
    # Fork PRs never receive the credential; lint, CodeQL and Trivy still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Snyk credential
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if test -z "$SNYK_TOKEN"; then
            echo "::error::Set the repository secret SNYK_TOKEN to activate Snyk. Missing credentials are not a passing scan."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tools/lint --ignore-scripts
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # 2026-10-07
        with:
          snyk-version: v1.1308.4
      - name: Check application and lint dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_DISABLE_ANALYTICS: "1"
        run: snyk test --all-projects --detection-depth=4 --dev --severity-threshold=high --ignore-policy
