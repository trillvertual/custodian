name: Published image security
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Scan latest published image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve published digest
        id: image
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://github.com/trillvertual/custodian/releases/latest/download/release.json > "$RUNNER_TEMP/release.json"
          jq --exit-status '.image == "ghcr.io/trillvertual/custodian-app" and (.imageDigest | test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/release.json" > /dev/null
          digest=$(jq -r .imageDigest "$RUNNER_TEMP/release.json")
          echo "ref=ghcr.io/trillvertual/custodian-app@$digest" >> "$GITHUB_OUTPUT"
      - name: Scan image
        id: scan
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ steps.image.outputs.ref }}
      - name: Publish image findings
        if: always() && steps.scan.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}
          category: container-published
