name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Types, tests and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run secrets:check
      - run: npm run release:check
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run release:package
      - run: npm run secrets:check -- --artifacts-only --path dist/release
      - name: Verify packaged runtime
        shell: bash
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS
          mkdir "$RUNNER_TEMP/custodian-runtime"
          tar -xzf custodian-*-runtime.tar.gz -C "$RUNNER_TEMP/custodian-runtime"
          cd "$RUNNER_TEMP"/custodian-runtime/custodian-*
          npm ci --omit=dev
          node packages/rescue/dist/index.js --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  container:
    name: Docker and PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run configure -- --url https://vault.test
      - run: docker compose -p custodian-ci config --quiet
      - run: docker compose -p custodian-ci up -d --build --wait --wait-timeout 180
      - run: npm run test:container
      - name: Check migrations and rescue executable
        run: |
          test "$(docker compose -p custodian-ci exec -T db psql -U vault -d vault -Atc 'SELECT max(version) FROM schema_migrations')" = 2
          docker compose -p custodian-ci exec -T app node packages/rescue/dist/index.js --help
      - name: Container diagnostics
        if: failure()
        run: docker compose -p custodian-ci logs --no-color --tail 100
      - name: Clean isolated test database
        if: always()
        run: docker compose -p custodian-ci down --volumes
