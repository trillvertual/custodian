name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Types, tests and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npm run secrets:check
      - run: npm run release:check
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm ci --prefix tools/lint --ignore-scripts
      - run: npm audit --prefix tools/lint --audit-level=high
      - run: npm run lint
      - run: npm run lint:verify
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run release:package
      - run: npm run secrets:check -- --artifacts-only --path dist/release
      - name: Verify packaged runtime
        shell: bash
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS
          mkdir "$RUNNER_TEMP/custodian-runtime"
          tar -xzf custodian-*-runtime.tar.gz -C "$RUNNER_TEMP/custodian-runtime"
          cd "$RUNNER_TEMP"/custodian-runtime/custodian-*
          npm ci --omit=dev
          node packages/rescue/dist/index.js --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  container:
    name: Docker and PostgreSQL 18
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run configure -- --url https://vault.test
      - run: docker compose -p custodian-ci config --quiet
      - run: docker compose -p custodian-ci up -d --build --wait --wait-timeout 180
      - run: npm run test:container
      - name: Check migrations and rescue executable
        run: |
          test "$(docker compose -p custodian-ci exec -T db psql -U vault -d vault -Atc 'SELECT max(version) FROM schema_migrations')" = 4
          docker compose -p custodian-ci exec -T app node packages/rescue/dist/index.js --help
      - name: Resolve built image
        id: built-image
        run: echo "ref=$(docker compose -p custodian-ci images --quiet app)" >> "$GITHUB_OUTPUT"
      - name: Scan built image
        id: image-scan
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ steps.built-image.outputs.ref }}
      - name: Publish built image findings
        if: always() && steps.image-scan.outputs.sarif-file != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.image-scan.outputs.sarif-file }}
          category: container-built
      - name: Container diagnostics
        if: failure()
        run: docker compose -p custodian-ci logs --no-color --tail 100
      - name: Clean isolated test database
        if: always()
        run: docker compose -p custodian-ci down --volumes
